version: "3.9"

services:
  load-balancer:
    build: .
    container_name: cloudmed-lb-gateway
    command: ["uvicorn", "app.load_balancer:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - NODE_1_URL=http://node-1:8001
      - NODE_2_URL=http://node-2:8002
      - NODE_3_URL=http://node-3:8003
      - NODE_4_URL=http://node-4:8004
      - CLOUDMED_RATE_LIMIT=250
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
    networks:
      - dmz-public-net
      - private-app-net

  node-1:
    build: .
    container_name: cloudmed-node-1
    command: ["uvicorn", "app.node_service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - CLOUDMED_NODE_ID=node-1
      - CLOUDMED_INSTANCE_TYPE=ecs.c6i.large
      - CLOUDMED_NODE_CAPACITY=1.6
      - CLOUDMED_AZ=us-east-1a
      - CLOUDMED_DATA_DIR=/srv/cloudmedvault/data
    volumes:
      - cloudmed_shared_storage:/srv/cloudmedvault/data
    networks:
      - private-app-net

  node-2:
    build: .
    container_name: cloudmed-node-2
    command: ["uvicorn", "app.node_service:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - CLOUDMED_NODE_ID=node-2
      - CLOUDMED_INSTANCE_TYPE=ecs.t3.medium
      - CLOUDMED_NODE_CAPACITY=1.0
      - CLOUDMED_AZ=us-east-1b
      - CLOUDMED_DATA_DIR=/srv/cloudmedvault/data
    volumes:
      - cloudmed_shared_storage:/srv/cloudmedvault/data
    networks:
      - private-app-net

  node-3:
    build: .
    container_name: cloudmed-node-3
    command: ["uvicorn", "app.node_service:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      - CLOUDMED_NODE_ID=node-3
      - CLOUDMED_INSTANCE_TYPE=ecs.t3.small
      - CLOUDMED_NODE_CAPACITY=0.6
      - CLOUDMED_AZ=us-east-1c
      - CLOUDMED_DATA_DIR=/srv/cloudmedvault/data
    volumes:
      - cloudmed_shared_storage:/srv/cloudmedvault/data
    networks:
      - private-app-net

  node-4:
    build: .
    container_name: cloudmed-node-4-elastic
    command: ["uvicorn", "app.node_service:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      - CLOUDMED_NODE_ID=node-4
      - CLOUDMED_INSTANCE_TYPE=ecs.c6i.large.spot
      - CLOUDMED_NODE_CAPACITY=1.4
      - CLOUDMED_AZ=us-east-1a
      - CLOUDMED_DATA_DIR=/srv/cloudmedvault/data
    volumes:
      - cloudmed_shared_storage:/srv/cloudmedvault/data
    networks:
      - private-app-net

networks:
  dmz-public-net:
    driver: bridge
  private-app-net:
    driver: bridge
    internal: true

volumes:
  cloudmed_shared_storage:
